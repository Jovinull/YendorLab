# Prepared, not launched. Requires explicit approval: see docs/results/m5.md.
# Investigation of whether reinforcement can improve a no-planner imitation policy.
[train]
experiment = "EXP-0035"
algorithm = "linear_td_v2"
task = "exploration_v2_floor"
budget = 250
encoder = "rel_v3"
disabled = ["frontier"]
init = "data/m5/bc/scaled-rel_no_planner-r1.json"
reward = "cells_v2"
master_seed = 20261103
run = 10
episodes = 20000
alpha = 0.02
gamma = 0.95
epsilon_start = 0.1
epsilon_end = 0.02
epsilon_decay_episodes = 5000
validation_every = 500
validation_episodes = 40
checkpoint_every = 25
periodic_checkpoint_every = 1000
keep_periodic = 10
validation_baseline = "data/m5/validation-baseline-random.json"

[limits]
cpu_cores = 3
nice = 10
memory_mb = 512
max_rss_mb = 1024
max_seconds = 28800
episode_seconds = 120.0
validation_workers = 2

[stop]
patience_validations = 10
min_delta = 10.0
