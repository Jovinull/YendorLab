[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yendorlab"
version = "0.1.0"
requires-python = ">=3.11"
description = "CPU research laboratory for Brogue Community Edition"

[project.optional-dependencies]
gym = ["gymnasium==1.2.2"]

[project.scripts]
yendorlab = "yendorlab.app:main"

[tool.setuptools.packages.find]
where = ["src"]
