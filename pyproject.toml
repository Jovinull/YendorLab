[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yendorlab"
version = "0.1.0"
requires-python = ">=3.10"
description = "CPU research laboratory for Brogue Community Edition"

[project.scripts]
yendorlab = "yendorlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
